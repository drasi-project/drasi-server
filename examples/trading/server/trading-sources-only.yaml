apiVersion: drasi.io/v1
id: trading-server
host: 0.0.0.0
port: 8280
logLevel: info
persistConfig: false
verifyPlugins: true
# start-demo.sh installs exactly the five reviewed, signed, digest-pinned plugins
# in an isolated registry directory. Its explicit --plugin-source local mode
# generates a runtime copy of this config whose pluginRegistry points at the
# isolated, validated local plugin directory.
# The app still creates its queries/reaction; installing SSE does not create it.
# Preparation must finish before startup; do not re-resolve unpinned refs here.
autoInstallPlugins: false
plugins:
  - ref: source/http
  - ref: source/postgres
  - ref: bootstrap/scriptfile
  - ref: bootstrap/postgres
  # `reaction/sse` is created at runtime by the React app via the Drasi REST API
  # (see app/src/drasi/config.ts), so it must be present in the plugins dir even
  # though the YAML below has no entry under `reactions:`.
  - ref: reaction/sse
sources:
- kind: http
  id: price-feed
  autoStart: true
  host: 0.0.0.0
  port: 9100
  timeoutMs: 10000
  bootstrapProvider:
    kind: scriptfile
    filePaths:
      - ./examples/trading/mock-generator/initial-prices.jsonl
- kind: postgres
  id: postgres-stocks
  autoStart: true
  # Bare-metal default: localhost:5632 (docker-compose publishes 5432 -> 5632).
  # Dev container overrides via POSTGRES_HOST=trading-postgres / POSTGRES_PORT=5432
  # (set in .devcontainer/trading/devcontainer.json) so drasi-server reaches
  # postgres over the shared `drasi-network`.
  host: "${POSTGRES_HOST:-localhost}"
  port: "${POSTGRES_PORT:-5632}"
  database: trading_demo
  user: drasi_user
  password: drasi_password
  tables:
  - stocks
  - portfolio
  - watchlist
  slotName: drasi_trading_slot
  publicationName: drasi_trading_pub
  sslMode: prefer
  tableKeys:
  - table: stocks
    keyColumns:
    - id
  - table: portfolio
    keyColumns:
    - id
  - table: watchlist
    keyColumns:
    - id
  bootstrapProvider:
    kind: postgres
- kind: postgres
  id: postgres-broker
  autoStart: true
  host: "${POSTGRES_HOST:-localhost}"
  port: "${POSTGRES_PORT:-5632}"
  database: trading_demo
  user: drasi_user
  password: drasi_password
  tables:
  - limit_orders
  slotName: drasi_broker_slot
  publicationName: drasi_broker_pub
  sslMode: prefer
  tableKeys:
  - table: limit_orders
    keyColumns:
    - id
  bootstrapProvider:
    kind: postgres
queries: []
reactions: []
