apiVersion: drasi.io/v1
host: 0.0.0.0
port: 8280
logLevel: info
persistConfig: false
verifyPlugins: true
# The app installs one complete native source/query group, then its SSE output.
# Start empty: no PostgreSQL producer runs before its real owners are present.
# app/public/native-computation.json is generated from the actual native factory
# metadata and app/src/services/queries.ts. Its canonical definition preserves
# secret configuration references, which readable graph configuration cannot bind.
# Use the matching local libraries built by ../build-local-plugins.sh.
autoInstallPlugins: false
plugins: []
instances:
  - id: trading-server
    persistIndex: false
    sources: []
    queries: []
    reactions: []
