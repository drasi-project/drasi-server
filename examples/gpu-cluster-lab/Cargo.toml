[workspace]
resolver = "2"
members = ["crates/contracts", "crates/policy", "crates/placement", "crates/simulator", "crates/control"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
gpu-contracts = { path = "crates/contracts" }
gpu-policy = { path = "crates/policy" }
gpu-placement = { path = "crates/placement" }
gpu-simulator = { path = "crates/simulator" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
regorus = { version = "=0.12.0", default-features = false, features = ["std", "arc"] }
good_lp = { version = "=1.15.0", default-features = false, features = ["microlp"] }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls","postgres","uuid","json","migrate","macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json","stream","rustls-tls"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
