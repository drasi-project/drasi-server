apiVersion: drasi.io/v1
host: 127.0.0.1
port: 8421
persistConfig: false
enableUi: true
# These plugins are built locally by ./demo setup.
verifyPlugins: false
corsAllowedOrigins:
  - http://127.0.0.1:5421

instances:
  - id: move-a-wall
    computation:
      graph:
        defaultPipeCapacity: 32

        resources:
          wall-memory-indexes:
            kind: memoryIndexes
          wall-query-catalog:
            kind: queryCatalog
          wall-output-snapshots:
            kind: nativeOutputSnapshots
            outputs:
              - {component: 00000000-0000-4000-8000-000000000003, port: out}
              - {component: 00000000-0000-4000-8000-000000000004, port: out}
              - {component: 00000000-0000-4000-8000-000000000005, port: out}
              - {component: 00000000-0000-4000-8000-000000000006, port: out}
              - {component: 00000000-0000-4000-8000-000000000007, port: out}
            timeoutMs: 5000
            maxReaders: 16

        components:
          - id: 00000000-0000-4000-8000-000000000001
            name: scene
            kind: move-a-wall/scene
            version: "1"

          - id: 00000000-0000-4000-8000-000000000002
            name: geometry
            kind: move-a-wall/geometry
            version: "1"

          - id: 00000000-0000-4000-8000-000000000003
            name: scene-inputs
            kind: drasi/continuous-query
            version: "1"
            resources:
              indexes: wall-memory-indexes
              catalog: wall-query-catalog
            config:
              outbox_capacity: 128
              query: |
                MATCH (n:SceneObject)
                RETURN collect(n.payload) AS objects

          - id: 00000000-0000-4000-8000-000000000004
            name: geometry-context
            kind: drasi/continuous-query
            version: "1"
            resources:
              indexes: wall-memory-indexes
              catalog: wall-query-catalog
            config:
              outbox_capacity: 128
              query: |
                MATCH (n:SceneObject)
                WHERE n.active = true
                RETURN collect(n.payload) AS objects

          - id: 00000000-0000-4000-8000-000000000005
            name: obstructions
            kind: drasi/continuous-query
            version: "1"
            resources:
              indexes: wall-memory-indexes
              catalog: wall-query-catalog
            config:
              outbox_capacity: 128
              query: |
                MATCH (o:Obstruction)
                RETURN o.id AS id, o.journey_id AS journey_id,
                       o.cart_id AS cart_id, o.obstacle_id AS obstacle_id,
                       o.distance_m AS distance_m, o.required_m AS required_m

          - id: 00000000-0000-4000-8000-000000000006
            name: affected-journeys
            kind: drasi/continuous-query
            version: "1"
            resources:
              indexes: wall-memory-indexes
              catalog: wall-query-catalog
            config:
              outbox_capacity: 128
              execution:
                joins:
                  - id: CART_TASK
                    keys:
                      - {label: Cart, property: cart_id}
                      - {label: Journey, property: cart_id}
                  - id: TO_DESTINATION
                    keys:
                      - {label: Journey, property: destination_id}
                      - {label: Destination, property: destination_id}
                  - id: BLOCKS
                    keys:
                      - {label: Obstruction, property: journey_id}
                      - {label: Journey, property: journey_id}
                  - id: CAUSED_BY
                    keys:
                      - {label: Obstruction, property: obstacle_id}
                      - {label: Obstacle, property: obstacle_id}
              query: |
                MATCH (c:Cart)-[:CART_TASK]->(j:Journey)-[:TO_DESTINATION]->(d:Destination),
                      (o:Obstruction)-[:BLOCKS]->(j),
                      (o)-[:CAUSED_BY]->(b:Obstacle)
                RETURN o.id AS id, c.id AS cart_id, c.name AS cart,
                       j.id AS journey_id, j.name AS task,
                       d.id AS destination_id, d.name AS destination,
                       b.id AS obstacle_id, b.name AS obstacle,
                       o.distance_m AS distance_m, o.required_m AS required_m

          - id: 00000000-0000-4000-8000-000000000007
            name: geometry-status
            kind: drasi/continuous-query
            version: "1"
            resources:
              indexes: wall-memory-indexes
              catalog: wall-query-catalog
            config:
              outbox_capacity: 128
              query: |
                MATCH (s:GeometryStatus)
                RETURN s.id AS id, s.revision AS revision,
                       s.objects AS objects, s.obstructions AS obstructions

      # Publish the same query results to the stock Server snapshot API.
          - id: 00000000-0000-4000-8000-000000000008
            name: query-results
            kind: drasi/query-results-outlet
            version: "1"
            resources:
              catalog: wall-query-catalog

      # Send query changes directly to the browser over native SSE.
          - id: 00000000-0000-4000-8000-000000000009
            name: wall-ui
            kind: drasi.network/sse-sink
            version: "1"
            resources:
              output_snapshots: wall-output-snapshots
            config:
              host: 127.0.0.1
              port: 8422
              ssePath: /events
              # Name each query's output for SSE events and snapshot URLs.
              outputs:
                scene-inputs: {component: 00000000-0000-4000-8000-000000000003}
                geometry-context: {component: 00000000-0000-4000-8000-000000000004}
                obstructions: {component: 00000000-0000-4000-8000-000000000005}
                affected-journeys: {component: 00000000-0000-4000-8000-000000000006}
                geometry-status: {component: 00000000-0000-4000-8000-000000000007}
              heartbeatIntervalMs: 5000

    # A component name selects its single output/input port.
        connections:
          - {from: 00000000-0000-4000-8000-000000000001, to: 00000000-0000-4000-8000-000000000003}
          - {from: 00000000-0000-4000-8000-000000000001, to: 00000000-0000-4000-8000-000000000004}
          - {from: 00000000-0000-4000-8000-000000000004, to: 00000000-0000-4000-8000-000000000002}
          - {from: 00000000-0000-4000-8000-000000000002, to: 00000000-0000-4000-8000-000000000005}
          - {from: 00000000-0000-4000-8000-000000000002, to: 00000000-0000-4000-8000-000000000006}
          - {from: 00000000-0000-4000-8000-000000000002, to: 00000000-0000-4000-8000-000000000007}

          - {from: 00000000-0000-4000-8000-000000000003, to: 00000000-0000-4000-8000-000000000008}
          - {from: 00000000-0000-4000-8000-000000000004, to: 00000000-0000-4000-8000-000000000008}
          - {from: 00000000-0000-4000-8000-000000000005, to: 00000000-0000-4000-8000-000000000008}
          - {from: 00000000-0000-4000-8000-000000000006, to: 00000000-0000-4000-8000-000000000008}
          - {from: 00000000-0000-4000-8000-000000000007, to: 00000000-0000-4000-8000-000000000008}

          - {from: 00000000-0000-4000-8000-000000000003, to: 00000000-0000-4000-8000-000000000009}
          - {from: 00000000-0000-4000-8000-000000000004, to: 00000000-0000-4000-8000-000000000009}
          - {from: 00000000-0000-4000-8000-000000000005, to: 00000000-0000-4000-8000-000000000009}
          - {from: 00000000-0000-4000-8000-000000000006, to: 00000000-0000-4000-8000-000000000009}
          - {from: 00000000-0000-4000-8000-000000000007, to: 00000000-0000-4000-8000-000000000009}
