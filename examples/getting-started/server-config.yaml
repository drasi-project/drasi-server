        name: message-count
        role: Transformer
        streams:
          out: message-count/out
      - completion: null
        construction:
          Factory:
            completion: null
            configuration:
              execution:
                Literal:
                  inputs:
                  - component: 4de4fbfc-15db-45a2-af0b-7fefd8056aa8
                  joins: []
                  middleware: []
              language:
                Literal: cypher
              outbox_capacity:
                Literal: 1000
              query:
                Literal: |
                  MATCH (m:message)
                  WITH m.from AS MessageFrom, max(drasi.changeDateTime(m)) AS LastMessageTimestamp
                  WHERE LastMessageTimestamp <= datetime.realtime() - duration({ seconds: 20 })
                    OR drasi.trueLater(
                         LastMessageTimestamp <= datetime.realtime() - duration({ seconds: 20 }),
                         LastMessageTimestamp + duration({ seconds: 20 })
                       )
                  RETURN MessageFrom, LastMessageTimestamp
              stream:
                Literal: inactive-people/out
