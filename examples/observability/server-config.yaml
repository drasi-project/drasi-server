apiVersion: drasi.io/v1
host: "127.0.0.1"
port: "${DRASI_DEMO_PORT:-18081}"
logLevel: info
persistConfig: false
enableUi: false
verifyPlugins: true
autoInstallPlugins: false
instances: []

# Omitting this whole section also gives the basic profile, no destinations
# and only GET /api/v1/telemetry. It is here so the DRASI_DEMO_* variables can
# override each setting.
telemetry:
  # off, basic, debug or persistence; off is the explicit opt-out.
  profile: "${DRASI_DEMO_PROFILE:-basic}"
  # Omitting inspection.enabled serves only GET /api/v1/telemetry; true adds
  # /api/v1/telemetry/metrics; false serves neither.
  tracing:
    endpoint: "${DRASI_DEMO_TRACE_ENDPOINT:-}"
    protocol: http/protobuf
    serviceName: drasi-server-observability
    sampleRatio: "${DRASI_DEMO_SAMPLE_RATIO:-0.1}"
  metrics:
    backend: "${DRASI_DEMO_METRICS_BACKEND:-none}"
    processMetrics: false
    prometheus:
      path: /metrics
    otlp:
      endpoint: "${DRASI_DEMO_METRICS_ENDPOINT:-http://127.0.0.1:4318/v1/metrics}"
      protocol: http/protobuf
      exportInterval: "${DRASI_DEMO_EXPORT_INTERVAL:-30}"
      exportTimeout: "${DRASI_DEMO_EXPORT_TIMEOUT:-5}"
  shutdownTimeoutSeconds: "${DRASI_DEMO_SHUTDOWN_TIMEOUT:-5}"
