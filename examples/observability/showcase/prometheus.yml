# Prometheus for the observability showcase (`demo.sh showcase`).
# Development only: no credentials, TLS, remote write or alerting.
# demo.sh writes the single target (Server's management listener, reached from
# the podman VM as host.containers.internal:<port>) into the owned run
# directory and mounts it read-only at /etc/prometheus/targets/.
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

scrape_configs:
  - job_name: drasi-server
    metrics_path: /metrics
    scheme: http
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/drasi-server.json
        refresh_interval: 5s
