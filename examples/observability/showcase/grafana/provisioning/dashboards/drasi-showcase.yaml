# Grafana dashboard provider for the observability showcase (`demo.sh showcase`).
# demo.sh mounts showcase/grafana/dashboards read-only at /etc/grafana/dashboards
# and makes drasi-server-observability.json the home dashboard.
apiVersion: 1

providers:
  - name: drasi-server-observability
    orgId: 1
    folder: ""
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/dashboards
