apiVersion: drasi.io/v1
host: "127.0.0.1"
port: "${DRASI_DEMO_PORT:-18081}"
logLevel: info
persistConfig: false
enableUi: false
verifyPlugins: true
autoInstallPlugins: false

# Launch through demo.sh live-postgres against an existing, isolated database.
# The launcher never starts, creates or deletes a database, slot or publication.
# Credentials are environment references only; never write resolved values here.
instances:
  - id: "${DRASI_DEMO_INSTANCE}"
    persistIndex: false
    sources:
      - kind: postgres
        name: observations
        autoStart: true
        host: "${DRASI_DEMO_PG_HOST}"
        port: "${DRASI_DEMO_PG_PORT:-5432}"
        database: "${DRASI_DEMO_PG_DATABASE}"
        user: "${DRASI_DEMO_PG_USER}"
        password: "${DRASI_DEMO_PG_PASSWORD}"
        sslMode: prefer
        tables:
          - observation
        slotName: "${DRASI_DEMO_PG_SLOT:-drasi_observability_slot}"
        publicationName: "${DRASI_DEMO_PG_PUBLICATION:-drasi_observability_pub}"
        tableKeys:
          - table: observation
            keyColumns:
              - id
    queries:
      # Bootstrap is disabled, so no bootstrap plugin is bundled or required.
      - name: observed-values
        autoStart: true
        query: "MATCH (n:observation) RETURN n.id AS id, n.value AS value"
        queryLanguage: Cypher
        enableBootstrap: false
        inputs:
          - observations
    reactions:
      - kind: log
        name: observed-log
        autoStart: true
        queries:
          - observed-values

telemetry:
  profile: "${DRASI_DEMO_PROFILE:-persistence}"
  inspection:
    enabled: false
  tracing:
    # CDC changes start new roots; they do not inherit a SQL client's trace.
    endpoint: "${DRASI_DEMO_TRACE_ENDPOINT:-}"
    protocol: http/protobuf
    serviceName: drasi-server-observability
    sampleRatio: "${DRASI_DEMO_SAMPLE_RATIO:-1.0}"
  metrics:
    backend: "${DRASI_DEMO_METRICS_BACKEND:-prometheus}"
    processMetrics: false
    prometheus:
      path: /metrics
    otlp:
      endpoint: "${DRASI_DEMO_METRICS_ENDPOINT:-http://127.0.0.1:4318/v1/metrics}"
      protocol: http/protobuf
      exportInterval: "${DRASI_DEMO_EXPORT_INTERVAL:-2}"
      exportTimeout: "${DRASI_DEMO_EXPORT_TIMEOUT:-1}"
  filters:
    exclude:
      - "${DRASI_DEMO_EXCLUDE:-drasi.plugin.}"
  shutdownTimeoutSeconds: "${DRASI_DEMO_SHUTDOWN_TIMEOUT:-5}"
