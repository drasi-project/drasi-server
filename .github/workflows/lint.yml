name: Lint

on:
  pull_request:

jobs:
  lint:
    uses: drasi-project/.github/.github/workflows/rust-lint.yaml@main
    with:
      install-jq: true
      install-protobuf: true
      clippy-command: "bash scripts/prepare-core.sh && cargo clippy --locked --all-targets -- -D warnings"
      clippy-args: ""
      fmt-command: "bash scripts/prepare-core.sh && make fmt-check"
