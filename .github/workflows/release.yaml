name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version Tag (optional, defaults to version from Cargo.toml)'
        required: false
        type: string
        default: ''
      image_prefix:
        description: 'Image Prefix (defaults to ghcr.io/<repo-owner>)'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Rehearse using test images; skip all official image/tag/release writes'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      candidate_sha:
        description: 'Exact committed candidate to build and test'
        required: true
        type: string
      base_sha:
        description: 'Baseline revision used to prepare the candidate'
        required: true
        type: string
      candidate_kind:
        description: 'Candidate classification recorded in test evidence'
        required: true
        type: string
      dry_run:
        description: 'Reusable checks never publish official images or releases'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  IMAGE_NAME: drasi-server
  CANDIDATE_KIND: ${{ inputs.candidate_kind || 'release' }}
  ARTIFACT_PREFIX: ${{ format('{0}-{1}', inputs.candidate_kind || 'release', github.run_attempt) }}
  STAGING_IMAGE: ghcr.io/${{ github.repository_owner }}/drasi-server-test
  # Resolved image prefix: use the user-provided value if set, otherwise default
  # to ghcr.io/<repo-owner> so forks publish to their own namespace by default.
  IMAGE_PREFIX: ${{ inputs.image_prefix != '' && inputs.image_prefix || format('ghcr.io/{0}', github.repository_owner) }}

jobs:
  # Determine the version tag to use
  determine-version:
    name: Determine Version Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      stage_tag: ${{ steps.version.outputs.stage_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Record immutable candidate and version
        id: version
        env:
          VERSION_TAG: ${{ inputs.tag }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          python3 scripts/release.py candidate --kind "$CANDIDATE_KIND" \
            --base-sha "$BASE_SHA" --tag "$VERSION_TAG" --output candidate.json
          {
            echo "## $CANDIDATE_KIND candidate"
            echo '```json'
            cat candidate.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-candidate
          path: candidate.json
          if-no-files-found: error

  validate-candidate:
    name: Validate committed dependency graph
    needs: determine-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.determine-version.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjq-dev libonig-dev protobuf-compiler
      - name: Validate final committed manifests and lockfiles
        env:
          JQ_LIB_DIR: /usr/lib/x86_64-linux-gnu
        run: |
          python3 scripts/plugin_origin.py mode
          cargo metadata --locked --format-version 1 --manifest-path examples/sse-cli/Cargo.toml > /dev/null
          cargo check --workspace --locked
          git diff --exit-code

  # Build all Linux binaries on a single runner using cross (the whole point of cross)
  build-linux:
    name: Build Linux binaries
    runs-on: ubuntu-latest
    needs: [determine-version, validate-candidate]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.determine-version.outputs.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      # Install cross from a pinned git commit: the last tagged release (0.2.5,
      # March 2022) ships container images based on glibc 2.27, which is too old
      # for current rustc's build-script binaries (require GLIBC_2.34). Main has
      # newer base images, but we pin to a specific commit for reproducibility.
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 65fe72b0cdb1e7e0cc0652517498d4389cc8f5cf --locked

      - name: Build all Linux targets
        run: |
          TARGETS=(
            "x86_64-unknown-linux-gnu:x86_64-linux-gnu"
            "aarch64-unknown-linux-gnu:aarch64-linux-gnu"
            "x86_64-unknown-linux-musl:x86_64-linux-musl"
            "aarch64-unknown-linux-musl:aarch64-linux-musl"
          )

          for entry in "${TARGETS[@]}"; do
            TARGET="${entry%%:*}"
            SUFFIX="${entry##*:}"
            ARTIFACT_NAME="drasi-server-${SUFFIX}"

            echo "========================================="
            echo "Building ${TARGET} -> ${ARTIFACT_NAME}"
            echo "========================================="

            rustup target add "${TARGET}"
            cross build --locked --release --target "${TARGET}" --bin drasi-server

            SRC="target/${TARGET}/release/drasi-server"
            if [[ -f "$SRC" ]]; then
              cp "$SRC" "$ARTIFACT_NAME"
              chmod +x "$ARTIFACT_NAME"
              echo "✓ ${ARTIFACT_NAME}"
            else
              echo "Error: Built binary not found at $SRC"
              ls -la "target/${TARGET}/release/" || true
              exit 1
            fi
          done

          echo "All Linux binaries built:"
          ls -lh drasi-server-*

      - name: Upload x86_64-linux-gnu
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-drasi-server-x86_64-linux-gnu
          path: drasi-server-x86_64-linux-gnu
          if-no-files-found: error

      - name: Upload aarch64-linux-gnu
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-drasi-server-aarch64-linux-gnu
          path: drasi-server-aarch64-linux-gnu
          if-no-files-found: error

      - name: Upload x86_64-linux-musl
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-drasi-server-x86_64-linux-musl
          path: drasi-server-x86_64-linux-musl
          if-no-files-found: error

      - name: Upload aarch64-linux-musl
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-drasi-server-aarch64-linux-musl
          path: drasi-server-aarch64-linux-musl
          if-no-files-found: error

  # macOS requires native builds (can't cross-compile to macOS)
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [determine-version, validate-candidate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact_suffix: aarch64-apple-darwin
            arch: ARM64
            runner: macos-latest
          - target: x86_64-apple-darwin
            artifact_suffix: x86_64-apple-darwin
            arch: x86_64
            runner: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.determine-version.outputs.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install build dependencies
        run: brew install protobuf pkg-config jq oniguruma autoconf automake libtool

      - name: Build x86_64 static libs (for cross-compile)
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          set -euo pipefail
          X86_PREFIX="${{ github.workspace }}/x86_64-deps"
          mkdir -p "$X86_PREFIX"

          # Build oniguruma for x86_64
          git clone --depth 1 https://github.com/kkos/oniguruma.git /tmp/oniguruma
          cd /tmp/oniguruma
          autoreconf -vfi
          ./configure --host=x86_64-apple-darwin --prefix="$X86_PREFIX" \
            CC="clang -arch x86_64" CFLAGS="-arch x86_64" \
            --enable-static --disable-shared
          make -j"$(sysctl -n hw.ncpu)" && make install

          # Build jq for x86_64 (with oniguruma)
          git clone --depth 1 https://github.com/jqlang/jq.git /tmp/jq
          cd /tmp/jq
          git submodule update --init
          autoreconf -fi
          ./configure --host=x86_64-apple-darwin --prefix="$X86_PREFIX" \
            CC="clang -arch x86_64" CFLAGS="-arch x86_64" \
            --with-oniguruma="$X86_PREFIX" \
            --enable-static --disable-shared --disable-maintainer-mode
          make -j"$(sysctl -n hw.ncpu)" && make install

          echo "x86_64 static libs installed to $X86_PREFIX:"
          ls -la "$X86_PREFIX/lib/"

      - name: Build binary
        run: |
          export LIBJQ_STATIC=1
          export LIBONIG_STATIC=1

          if [[ "${{ matrix.target }}" == "x86_64-apple-darwin" ]]; then
            X86_PREFIX="${{ github.workspace }}/x86_64-deps"
            export JQ_LIB_DIR="$X86_PREFIX/lib"
            export ONIG_LIB_DIR="$X86_PREFIX/lib"
            export PKG_CONFIG_PATH="$X86_PREFIX/lib/pkgconfig"
            export CFLAGS_x86_64_apple_darwin="-arch x86_64"
          else
            JQ_LIB_DIR="$(brew --prefix jq)/lib"
            ONIG_LIB_DIR="$(brew --prefix oniguruma)/lib"
            export JQ_LIB_DIR ONIG_LIB_DIR
          fi

          cargo build --locked --release --target ${{ matrix.target }} --bin drasi-server

          SRC_BINARY="target/${{ matrix.target }}/release/drasi-server"
          ARTIFACT_NAME="drasi-server-${{ matrix.artifact_suffix }}"

          if [[ -f "$SRC_BINARY" ]]; then
            cp "$SRC_BINARY" "$ARTIFACT_NAME"
            chmod +x "$ARTIFACT_NAME"
          else
            echo "Error: Built binary not found at $SRC_BINARY"
            exit 1
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-drasi-server-${{ matrix.artifact_suffix }}
          path: drasi-server-${{ matrix.artifact_suffix }}
          if-no-files-found: error

  # Windows MSVC native build (uses vendored static libs for jq and OpenSSL)
  build-windows-msvc:
    name: Build Windows MSVC (x86_64)
    runs-on: windows-latest
    needs: [determine-version, validate-candidate]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.determine-version.outputs.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Pull vendored native libraries
        shell: bash
        run: cargo xtask vendor pull x86_64-pc-windows-msvc --tag v1

      - name: Build binary
        shell: bash
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc --bin drasi-server

          SRC_BINARY="target/x86_64-pc-windows-msvc/release/drasi-server.exe"
          ARTIFACT_NAME="drasi-server-x86_64-windows-msvc.exe"

          echo "=== Build output ==="
          ls -lh "$SRC_BINARY" || true
          file "$SRC_BINARY" || true

          if [[ -f "$SRC_BINARY" ]]; then
            cp "$SRC_BINARY" "$ARTIFACT_NAME"
            echo "✓ Built $ARTIFACT_NAME ($(du -h "$ARTIFACT_NAME" | cut -f1))"
          else
            echo "Error: Built binary not found at $SRC_BINARY"
            echo "=== release directory listing ==="
            ls -la "target/x86_64-pc-windows-msvc/release/" || true
            exit 1
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-drasi-server-x86_64-windows-msvc
          path: drasi-server-x86_64-windows-msvc.exe
          if-no-files-found: error

  # ─── SSE CLI builds (pure Rust, no C dependencies) ───

  # Build all Linux SSE CLI binaries using cross
  build-sse-cli-linux:
    name: Build SSE CLI Linux binaries
    runs-on: ubuntu-latest
    needs: [determine-version, validate-candidate]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.determine-version.outputs.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      # See note in build-linux about why we install cross from a pinned commit.
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 65fe72b0cdb1e7e0cc0652517498d4389cc8f5cf --locked

      - name: Build all Linux targets
        run: |
          TARGETS=(
            "x86_64-unknown-linux-gnu:x86_64-linux-gnu"
            "aarch64-unknown-linux-gnu:aarch64-linux-gnu"
            "x86_64-unknown-linux-musl:x86_64-linux-musl"
            "aarch64-unknown-linux-musl:aarch64-linux-musl"
          )

          for entry in "${TARGETS[@]}"; do
            TARGET="${entry%%:*}"
            SUFFIX="${entry##*:}"
            ARTIFACT_NAME="drasi-sse-cli-${SUFFIX}"

            echo "========================================="
            echo "Building SSE CLI ${TARGET} -> ${ARTIFACT_NAME}"
            echo "========================================="

            rustup target add "${TARGET}"
            cross build --locked --release --target "${TARGET}" --manifest-path examples/sse-cli/Cargo.toml

            SRC="examples/sse-cli/target/${TARGET}/release/drasi-sse-cli"
            if [[ -f "$SRC" ]]; then
              cp "$SRC" "$ARTIFACT_NAME"
              chmod +x "$ARTIFACT_NAME"
              echo "✓ ${ARTIFACT_NAME}"
            else
              echo "Error: Built binary not found at $SRC"
              ls -la "target/${TARGET}/release/" || true
              exit 1
            fi
          done

          echo "All SSE CLI Linux binaries built:"
          ls -lh drasi-sse-cli-*

      - name: Upload x86_64-linux-gnu
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-drasi-sse-cli-x86_64-linux-gnu
          path: drasi-sse-cli-x86_64-linux-gnu
          if-no-files-found: error

      - name: Upload aarch64-linux-gnu
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-drasi-sse-cli-aarch64-linux-gnu
          path: drasi-sse-cli-aarch64-linux-gnu
          if-no-files-found: error

      - name: Upload x86_64-linux-musl
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-drasi-sse-cli-x86_64-linux-musl
          path: drasi-sse-cli-x86_64-linux-musl
          if-no-files-found: error

      - name: Upload aarch64-linux-musl
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-drasi-sse-cli-aarch64-linux-musl
          path: drasi-sse-cli-aarch64-linux-musl
          if-no-files-found: error

  # macOS SSE CLI builds (native)
  build-sse-cli-macos:
    name: Build SSE CLI macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [determine-version, validate-candidate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact_suffix: aarch64-apple-darwin
            arch: ARM64
            runner: macos-latest
          - target: x86_64-apple-darwin
            artifact_suffix: x86_64-apple-darwin
            arch: x86_64
            runner: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.determine-version.outputs.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build binary
        run: |
          cargo build --locked --release --target ${{ matrix.target }} --manifest-path examples/sse-cli/Cargo.toml

          SRC_BINARY="examples/sse-cli/target/${{ matrix.target }}/release/drasi-sse-cli"
          ARTIFACT_NAME="drasi-sse-cli-${{ matrix.artifact_suffix }}"

          if [[ -f "$SRC_BINARY" ]]; then
            cp "$SRC_BINARY" "$ARTIFACT_NAME"
            chmod +x "$ARTIFACT_NAME"
          else
            echo "Error: Built binary not found at $SRC_BINARY"
            ls -la "examples/sse-cli/target/${{ matrix.target }}/release/" || true
            exit 1
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-drasi-sse-cli-${{ matrix.artifact_suffix }}
          path: drasi-sse-cli-${{ matrix.artifact_suffix }}
          if-no-files-found: error

  # Windows SSE CLI build (cross-compiled from Linux)
  build-sse-cli-windows:
    name: Build SSE CLI Windows (x86_64)
    runs-on: ubuntu-latest
    needs: [determine-version, validate-candidate]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.determine-version.outputs.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      # See note in build-linux about why we install cross from a pinned commit.
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 65fe72b0cdb1e7e0cc0652517498d4389cc8f5cf --locked

      - name: Build binary
        run: |
          rustup target add x86_64-pc-windows-gnu
          cross build --locked --release --target x86_64-pc-windows-gnu --manifest-path examples/sse-cli/Cargo.toml

          SRC_BINARY="examples/sse-cli/target/x86_64-pc-windows-gnu/release/drasi-sse-cli.exe"
          ARTIFACT_NAME="drasi-sse-cli-x86_64-windows.exe"

          if [[ -f "$SRC_BINARY" ]]; then
            cp "$SRC_BINARY" "$ARTIFACT_NAME"
            echo "✓ Built $ARTIFACT_NAME ($(du -h "$ARTIFACT_NAME" | cut -f1))"
          else
            echo "Error: Built binary not found at $SRC_BINARY"
            ls -la "examples/sse-cli/target/x86_64-pc-windows-gnu/release/" || true
            exit 1
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-drasi-sse-cli-x86_64-windows
          path: drasi-sse-cli-x86_64-windows.exe
          if-no-files-found: error

  # Build Docker images for Linux platforms
  build-docker:
    name: Stage Docker ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: [determine-version, validate-candidate]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.determine-version.outputs.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build once into the dedicated test package
        env:
          STAGE_TAG: ${{ needs.determine-version.outputs.stage_tag }}-${{ matrix.suffix }}
          CANDIDATE_SHA: ${{ needs.determine-version.outputs.sha }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker buildx build . --platform "$PLATFORM" --push \
            --provenance=mode=min \
            --label "org.opencontainers.image.revision=$CANDIDATE_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$STAGING_IMAGE:$STAGE_TAG" --metadata-file image.json \
            --cache-from type=gha --cache-to type=gha,mode=max
          DIGEST=$(jq -er '."containerimage.digest"' image.json)
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '%s@%s\n' "$STAGING_IMAGE" "$DIGEST" > image-reference.txt
          echo "Staged $CANDIDATE_SHA: \`$STAGING_IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-image-${{ matrix.suffix }}
          path: |
            image-reference.txt
            image.json
          if-no-files-found: error

  test-containers:
    name: Smoke pulled image (${{ matrix.arch }})
    needs: [determine-version, build-docker]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.determine-version.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-image-${{ matrix.arch }}
      - uses: actions/download-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-candidate
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test default startup and hello-world on exact pulled digest
        env:
          CANDIDATE_SHA: ${{ needs.determine-version.outputs.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          IMAGE=$(cat image-reference.txt)
          bash scripts/smoke-release-container.sh "$IMAGE" "$CANDIDATE_SHA" "$ARCH" runtime
          python3 scripts/release.py record --candidate candidate.json \
            --type container --target "$ARCH" --image "$IMAGE" \
            --runtime runtime/runtime.json --default-runtime runtime/default.json \
            --output "container-$ARCH.json"
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-evidence-container-${{ matrix.arch }}
          path: container-${{ matrix.arch }}.json
          if-no-files-found: error
      - name: Preserve runtime logs, including failures
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-container-logs-${{ matrix.arch }}
          path: runtime/
          if-no-files-found: warn

  assemble-assets:
    name: Assemble and validate all release assets
    needs: [determine-version, build-linux, build-macos, build-windows-msvc, build-sse-cli-linux, build-sse-cli-macos, build-sse-cli-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.determine-version.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-candidate
      - uses: actions/download-artifact@v5
        with:
          pattern: ${{ env.ARTIFACT_PREFIX }}-drasi-*
          path: artifacts
      - run: |
          python3 scripts/release.py assets --candidate candidate.json \
            --artifacts artifacts --directory release-assets --output assets.json
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-assets
          path: release-assets/
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-evidence-assets
          path: assets.json
          if-no-files-found: error

  release-gate:
    name: Require complete same-candidate release evidence
    if: always()
    needs: [determine-version, validate-candidate, build-linux, build-macos, build-windows-msvc, build-sse-cli-linux, build-sse-cli-macos, build-sse-cli-windows, build-docker, test-binaries, test-containers, assemble-assets]
    runs-on: ubuntu-latest
    env:
      REQUIRED_RESULTS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.determine-version.outputs.sha || github.sha }}
          persist-credentials: false
      - name: Reject failed, cancelled, skipped or missing jobs
        run: python3 scripts/release.py check-jobs --needs "$REQUIRED_RESULTS"
      - uses: actions/download-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-candidate
      - uses: actions/download-artifact@v5
        with:
          pattern: ${{ env.ARTIFACT_PREFIX }}-evidence-*
          path: evidence
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-assets
          path: release-assets
      - name: Bind runtime evidence and all asset hashes to this candidate
        run: |
          python3 scripts/release.py gate --candidate candidate.json \
            --needs "$REQUIRED_RESULTS" --evidence evidence --assets release-assets \
            --staging-image "$STAGING_IMAGE" --output approval.json
          {
            echo "## Approved $CANDIDATE_KIND candidate"
            echo '```json'
            cat approval.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-approval
          path: approval.json
          if-no-files-found: error

  create-manifest:
    name: Promote tested images and multiarch manifest
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.candidate_kind == '' && inputs.candidate_sha == '' && needs.release-gate.result == 'success' }}
    needs: [determine-version, release-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.determine-version.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-candidate
      - uses: actions/download-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-approval
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote only the tested digests without rebuilding
        run: |
          python3 scripts/release.py promote --candidate candidate.json \
            --approval approval.json --staging-image "$STAGING_IMAGE" \
            --image "$IMAGE_PREFIX/$IMAGE_NAME" --output publication.json
          {
            echo "## Published tested image digests"
            echo '```json'
            cat publication.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-publication
          path: publication.json
          if-no-files-found: error

  # Smoke-test each binary with the hello-world (mock source) config
  test-binaries:
    name: Test ${{ matrix.artifact_suffix }}
    needs: [determine-version, build-linux, build-macos, build-windows-msvc]
    runs-on: ${{ matrix.runner }}
    env:
      PYTHON: python
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM64 (Apple Silicon)
          - artifact_suffix: aarch64-apple-darwin
            runner: macos-latest
            binary_name: "drasi-server-aarch64-apple-darwin"
          # macOS x86_64 (Intel) - cross-compiled, tested via Rosetta 2
          - artifact_suffix: x86_64-apple-darwin
            runner: macos-latest
            binary_name: "drasi-server-x86_64-apple-darwin"
          # Linux x86_64
          - artifact_suffix: x86_64-linux-gnu
            runner: ubuntu-latest
            binary_name: "drasi-server-x86_64-linux-gnu"
          # Linux ARM64
          - artifact_suffix: aarch64-linux-gnu
            runner: ubuntu-24.04-arm
            binary_name: "drasi-server-aarch64-linux-gnu"
          # Windows x86_64 (MSVC)
          - artifact_suffix: x86_64-windows-msvc
            runner: windows-latest
            binary_name: "drasi-server-x86_64-windows-msvc.exe"
          # Linux x86_64 (musl) — tested inside Alpine container
          - artifact_suffix: x86_64-linux-musl
            runner: ubuntu-latest
            binary_name: "drasi-server-x86_64-linux-musl"
            use_alpine: true
          # Linux ARM64 (musl) — tested inside Alpine container
          - artifact_suffix: aarch64-linux-musl
            runner: ubuntu-24.04-arm
            binary_name: "drasi-server-aarch64-linux-musl"
            use_alpine: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.determine-version.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/download-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-candidate

      - name: Download binary artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-drasi-server-${{ matrix.artifact_suffix }}
          path: bin

      - name: Run hello-world smoke test (Unix)
        if: runner.os != 'Windows' && !matrix.use_alpine
        run: |
          chmod +x "bin/${{ matrix.binary_name }}"
          BINARY="$(pwd)/bin/${{ matrix.binary_name }}"

          # Plugins are auto-installed at server startup (autoInstallPlugins: true
          # in the test config) from the default OCI registry.
          SERVER_BINARY="$BINARY" \
            SMOKE_REPORT="$(pwd)/runtime.json" \
            tests/integration/hello-world/run-integration-test.sh

      - name: Run hello-world smoke test (Alpine/musl)
        if: matrix.use_alpine
        run: |
          chmod +x "bin/${{ matrix.binary_name }}"
          docker run --rm \
            -v "$(pwd)/bin:/bin-artifacts" \
            -v "$(pwd)/tests:/tests" \
            -v "$(pwd):/workspace" -w /workspace \
            alpine:latest \
            sh -c "
              apk add --no-cache bash curl python3 libstdc++ libgcc &&
              SERVER_BINARY=/bin-artifacts/${{ matrix.binary_name }} \
                SMOKE_REPORT=/workspace/runtime.json \
                bash /tests/integration/hello-world/run-integration-test.sh
            "

      - name: Run hello-world smoke test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          BINARY_PATH="$(pwd)/bin/${{ matrix.binary_name }}"

          echo "=== Downloaded artifact contents ==="
          find bin/ -type f | head -30
          echo ""

          echo "=== Binary info ==="
          file "$BINARY_PATH" || true
          echo "Size: $(du -h "$BINARY_PATH" | cut -f1)"
          echo ""

          # Quick sanity: try running with --help first
          echo "=== Sanity check: --help ==="
          "$BINARY_PATH" --help 2>&1 || echo "(exit code: $?)"
          echo ""

          # Plugins are auto-installed at server startup (autoInstallPlugins: true
          # in the test config) from the default OCI registry.
          SERVER_BINARY="$BINARY_PATH" \
            SMOKE_REPORT="$(pwd)/runtime.json" \
            tests/integration/hello-world/run-integration-test.sh

      - name: Record tested binary and loaded plugin identities
        shell: bash
        env:
          TARGET: ${{ matrix.artifact_suffix }}
          BINARY: bin/${{ matrix.binary_name }}
        run: |
          python scripts/release.py record --candidate candidate.json --type binary \
            --target "$TARGET" --binary "$BINARY" --runtime runtime.json \
            --output "binary-$TARGET.json"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-evidence-binary-${{ matrix.artifact_suffix }}
          path: binary-${{ matrix.artifact_suffix }}.json
          if-no-files-found: error

      - name: Show server logs on failure
        if: failure()
        shell: bash
        run: |
          echo "=== Server logs ==="
          if [ -f tests/integration/hello-world/server.log ]; then
            cat tests/integration/hello-world/server.log
          else
            echo "No server log file found"
          fi
          echo ""
          echo "=== bin/ directory ==="
          ls -la bin/ 2>/dev/null || true
          echo ""
          echo "=== Windows Event Logs (Application) ==="
          powershell -Command "Get-WinEvent -LogName Application -MaxEvents 10 | Format-List" 2>/dev/null || true

  # Create GitHub Release with binary artifacts
  create-release:
    name: Create GitHub Release
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.candidate_kind == '' && inputs.candidate_sha == '' && needs.release-gate.result == 'success' }}
    needs: [determine-version, release-gate, create-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.determine-version.outputs.tag }}
      CANDIDATE_SHA: ${{ needs.determine-version.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.determine-version.outputs.sha }}
          persist-credentials: false

      - name: Download already checked release assets
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-assets
          path: release-assets

      - uses: actions/download-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-candidate
      - uses: actions/download-artifact@v5
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-approval
      - name: Verify approved asset bytes before any release writes
        run: |
          python3 scripts/release.py verify-assets --candidate candidate.json \
            --approval approval.json --assets release-assets

      - name: Create release notes
        run: |
          cat > release-notes.md << 'NOTES_EOF'
          ## Binary Artifacts

          This release includes pre-built binaries for the following platforms:

          ### macOS
          - ARM64 (Apple Silicon) - `drasi-server-aarch64-apple-darwin`
          - x86_64 (Intel) - `drasi-server-x86_64-apple-darwin`

          ### Windows
          - x86_64 (MSVC) - `drasi-server-x86_64-windows-msvc.exe`

          ### Linux (glibc)
          - ARM64 - `drasi-server-aarch64-linux-gnu`
          - x86_64 - `drasi-server-x86_64-linux-gnu`

          ### Linux (musl)
          - ARM64 - `drasi-server-aarch64-linux-musl`
          - x86_64 - `drasi-server-x86_64-linux-musl`

          ## Examples

          - `drasi-server-examples.zip` — Example configurations, scripts, and projects

          ## SSE CLI Binaries

          Pre-built binaries for the `drasi-sse-cli` tool (streams query change events via SSE):

          ### macOS
          - ARM64 (Apple Silicon) - `drasi-sse-cli-aarch64-apple-darwin`
          - x86_64 (Intel) - `drasi-sse-cli-x86_64-apple-darwin`

          ### Windows
          - x86_64 - `drasi-sse-cli-x86_64-windows.exe`

          ### Linux (glibc)
          - ARM64 - `drasi-sse-cli-aarch64-linux-gnu`
          - x86_64 - `drasi-sse-cli-x86_64-linux-gnu`

          ### Linux (musl)
          - ARM64 - `drasi-sse-cli-aarch64-linux-musl`
          - x86_64 - `drasi-sse-cli-x86_64-linux-musl`

          ## Docker Images

          Multi-arch Docker images are available at:

          Supported architectures: `linux/amd64`, `linux/arm64`
          NOTES_EOF
          # shellcheck disable=SC2016
          printf '\n- `%s/%s:%s`\n- `%s/%s:latest`\n\nCandidate: `%s`\n' \
            "$IMAGE_PREFIX" "$IMAGE_NAME" "$TAG" "$IMAGE_PREFIX" "$IMAGE_NAME" \
            "$CANDIDATE_SHA" >> release-notes.md

      - name: Create or update versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Mark versions carrying a -preview suffix (e.g. 1.4.0-preview.1) as
          # GitHub pre-releases; everything else is published as a full release.
          if [[ "$TAG" == *-preview* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          if gh release view "${TAG}" --repo ${{ github.repository }} 2>/dev/null; then
            echo "Release ${TAG} already exists. Updating with new artifacts..."
            gh release upload "${TAG}" release-assets/* --repo ${{ github.repository }} --clobber
            gh release edit "${TAG}" --repo ${{ github.repository }} --prerelease="${PRERELEASE}"
          else
            echo "Creating new release ${TAG} (prerelease=${PRERELEASE})..."
            gh release create "${TAG}" \
              release-assets/* \
              --repo ${{ github.repository }} \
              --title "Release ${TAG}" \
              --target "$CANDIDATE_SHA" \
              --notes-file release-notes.md \
              --prerelease="${PRERELEASE}"
          fi

      - name: Create or update 'latest' GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Delete existing 'latest' release and tag if they exist
          if gh release view "latest" --repo ${{ github.repository }} 2>/dev/null; then
            echo "Deleting existing 'latest' release..."
            gh release delete "latest" --repo ${{ github.repository }} --yes --cleanup-tag
          fi

          echo "Creating 'latest' release (pointing to ${TAG})..."
          gh release create "latest" \
            release-assets/* \
            --repo ${{ github.repository }} \
            --title "Latest Release (${TAG})" \
            --target "$CANDIDATE_SHA" \
            --notes-file release-notes.md \
            --prerelease

      - name: Update summary
        run: |
          {
            echo "## GitHub Releases Published"
            echo "- Versioned: [\`${TAG}\`](https://github.com/$GITHUB_REPOSITORY/releases/tag/${TAG})"
            echo "- Latest: [\`latest\`](https://github.com/$GITHUB_REPOSITORY/releases/tag/latest)"
            echo "Candidate: \`$CANDIDATE_SHA\`"
            echo "Total validated assets: 15"
          } >> "$GITHUB_STEP_SUMMARY"
