name: Build and Release
run-name: "${{ inputs.nightly_test && 'Nightly rehearsal' || inputs.dry_run && 'Release rehearsal' || 'Release' }} (${{ github.ref_name }})"

on:
  workflow_dispatch:
    inputs:
      nightly_test:
        description: 'Test the full nightly process on this branch, including dependency upgrades; never publish official releases'
        required: false
        type: boolean
        default: false
      tag:
        description: 'Version Tag (optional, defaults to version from Cargo.toml; ignored for nightly_test)'
        required: false
      image_prefix:
        description: 'Official image prefix (defaults to ghcr.io/<repo-owner>; ignored for nightly_test)'
        required: false
        default: ''
      dry_run:
        description: 'Rehearse using test images; skip all official image/tag/release writes (nightly_test is always non-publishing)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  nightly-test:
    name: Full nightly rehearsal of selected branch
    if: inputs.nightly_test
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release-rehearsal.yaml
    with:
      base_sha: ${{ github.sha }}

  release:
    name: Check selected release candidate
    if: ${{ !inputs.nightly_test }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release-candidate.yaml
    with:
      candidate_sha: ${{ github.sha }}
      base_sha: ${{ github.sha }}
      candidate_kind: release
      tag: ${{ inputs.tag }}
      image_prefix: ${{ inputs.image_prefix }}
      publish_official: ${{ !inputs.dry_run }}
