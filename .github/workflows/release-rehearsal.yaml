name: Daily Release Rehearsal

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      base_sha:
        description: 'Exact baseline commit selected by the manual entry workflow'
        required: true
        type: string

permissions:
  contents: read

jobs:
  base-revision:
    name: Record baseline revision
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.baseline.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || inputs.base_sha || github.sha }}
          persist-credentials: false
      - id: baseline
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Rehearsal baseline: \`$SHA\` (scheduled runs resolve fresh main; manual runs use the selected commit)" >> "$GITHUB_STEP_SUMMARY"

  locked:
    name: Locked baseline health
    needs: base-revision
    # The reusable workflow has a contents:write release job, but its publication
    # is explicitly disabled for both rehearsal candidates.
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release-candidate.yaml
    with:
      candidate_sha: ${{ needs.base-revision.outputs.sha }}
      base_sha: ${{ needs.base-revision.outputs.sha }}
      candidate_kind: locked
      publish_official: false

  prepare-upgrade:
    name: Prepare isolated dependency-upgrade commit
    needs: base-revision
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.base-revision.outputs.sha }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - name: Install cargo-edit
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo install cargo-edit --locked
      - name: Apply the real version-bump policy
        env:
          MODE: bump
          BUMP: patch
        run: bash scripts/update-release-dependencies.sh
      - name: Commit all dependency changes on an isolated branch
        id: commit
        env:
          BASE_SHA: ${{ needs.base-revision.outputs.sha }}
        run: |
          set -euo pipefail
          BRANCH="automation/release-rehearsal/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          # Stage every changed manifest/lockfile; reject any other mutation.
          python3 - <<'PY'
          import subprocess
          from pathlib import PurePosixPath
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "-z"], text=True).split("\0")
          paths = [path for path in changed if path]
          if not paths or any(PurePosixPath(path).name not in ("Cargo.toml", "Cargo.lock") for path in paths):
              raise SystemExit("Expected only manifest/lockfile candidate changes")
          subprocess.run(["git", "add", "--", *paths], check=True)
          PY
          git -c user.name=github-actions[bot] \
              -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -m "test: rehearse dependency update from $BASE_SHA"
          SHA=$(git rev-parse HEAD)
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo "Dependency experiment: \`$SHA\`"
            echo "Baseline commit: \`$BASE_SHA\`"
            echo "Isolated branch: \`$BRANCH\` (not the version-bump PR branch)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve failed preparation diagnostics
        if: failure()
        run: git --no-pager diff -- '**/Cargo.toml' '**/Cargo.lock' Cargo.toml Cargo.lock

  upgrade:
    name: Experimental dependency-upgrade rehearsal
    needs: [base-revision, prepare-upgrade]
    permissions:
      contents: write
      packages: write
    # Explicit invocation: GITHUB_TOKEN pushes do not trigger another workflow.
    uses: ./.github/workflows/release-candidate.yaml
    with:
      candidate_sha: ${{ needs.prepare-upgrade.outputs.sha }}
      base_sha: ${{ needs.base-revision.outputs.sha }}
      candidate_kind: upgrade
      publish_official: false

  summary:
    name: Rehearsal outcomes
    if: always()
    needs: [base-revision, locked, prepare-upgrade, upgrade]
    runs-on: ubuntu-latest
    env:
      LOCKED_RESULT: ${{ needs.locked.result }}
      PREPARATION_RESULT: ${{ needs.prepare-upgrade.result }}
      UPGRADE_RESULT: ${{ needs.upgrade.result }}
      BASE_SHA: ${{ needs.base-revision.outputs.sha }}
      UPGRADE_SHA: ${{ needs.prepare-upgrade.outputs.sha }}
    steps:
      - run: |
          {
            echo "## Release rehearsal"
            echo "| Candidate | SHA | Result |"
            echo "| --- | --- | --- |"
            echo "| Locked baseline | $BASE_SHA | $LOCKED_RESULT |"
            echo "| Upgrade preparation | $UPGRADE_SHA | $PREPARATION_RESULT |"
            echo "| Experimental dependency upgrade | $UPGRADE_SHA | $UPGRADE_RESULT |"
            echo ""
            echo "An upgrade failure is not evidence that the locked release candidate is unhealthy."
            echo "No official image tags, Git tags, Releases or main were changed."
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$LOCKED_RESULT" == success && "$PREPARATION_RESULT" == success && "$UPGRADE_RESULT" == success ]]
