# `strict-example`. The provider receives no source-only fields.
apiVersion: drasi.io/v1
persistConfig: false
bootstrapProviders:
  - id: example-bootstrap
    kind: strict-example
    endpoint: https://example.invalid
    credential: test-placeholder
sources:
