# scripts/config.mjs renders the three port markers to concrete numbers.
apiVersion: drasi.io/v1
host: "127.0.0.1"
port: "${EXAMPLE_REST_PORT}"
persistConfig: false
enableUi: false
verifyPlugins: true
autoInstallPlugins: false
logLevel: info
instances:
  - id: cold-chain
    sources:
      - kind: http
        id: probe-feed
        autoStart: true
        host: "127.0.0.1"
        port: "${EXAMPLE_FEED_PORT}"
        timeoutMs: 10000
        bootstrapProvider:
          kind: scriptfile
          filePaths: ["./readings.jsonl"]
    queries:
      - id: north-room
        query: >
          MATCH (p:Probe) WHERE p.room = 'North'
          RETURN p.probeId AS probeId, p.room AS room, p.temperatureC AS temperatureC
        queryLanguage: Cypher
        autoStart: true
        sources:
          - sourceId: probe-feed
      - id: south-room
        query: >
          MATCH (p:Probe) WHERE p.room = 'South'
          RETURN p.probeId AS probeId, p.room AS room, p.temperatureC AS temperatureC
        queryLanguage: Cypher
        autoStart: true
        sources:
          - sourceId: probe-feed
    reactions:
      - kind: sse
        id: cold-chain-events
        autoStart: true
        queries: [north-room, south-room]
        host: "127.0.0.1"
        port: "${EXAMPLE_SSE_PORT}"
        ssePath: /events
        heartbeatIntervalMs: 1000
